name: QA Automation Tests
on: push
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      BASE_URL: https://jsonplaceholder.typicode.com
      API_TOKEN: test-token
      DB_NAME: qa_db
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: qa_user
      DB_PASSWORD: qa_password
      BASE_URL_LOCAL: http://127.0.0.1:8000

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: qa_db
          POSTGRES_USER: qa_user
          POSTGRES_PASSWORD: qa_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qa_user -d qa_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Install Playwright browsers
        run: python -m playwright install --with-deps chromium

      - name: Initialize database
        run: |
          sudo apt-get update 
          sudo apt-get install -y postgresql-client
          PGPASSWORD="$DB_PASSWORD" psql \
            -h "$DB_HOST" \
            -p "$DB_PORT" \
            -U "$DB_USER" \
            -d "$DB_NAME" \
            -f sql/init.sql

      - name: Start local API
        run: |
          python -m uvicorn api.integration_api:app --host 0.0.0.0 --port 8000 > api.log 2>&1 &
          ready=false
          for i in {1..10}; do
            if curl -fsS http://127.0.0.1:8000/health; then
              echo "API is ready"
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != "true" ]; then
            cat api.log
            echo "API failed to start"
            exit 1
          fi
      - name: Run pytest
        run: python -m pytest -v
