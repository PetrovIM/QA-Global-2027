name: QA Automation Tests
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Java for Allure
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Allure CLI
        run: npm install -g allure-commandline

      - name: Run tests in Docker Compose
        run: |
          mkdir -p ci-artifacts
          docker compose up --build --abort-on-container-exit --exit-code-from tests

      - name: Generate Allure report
        if: always()
        run: |
          if [ -d ci-artifacts/allure-results ] && [ "$(find ci-artifacts/allure-results -type f -print -quit)" ]; then
            allure generate ci-artifacts/allure-results --clean -o ci-artifacts/allure-report
          else
            echo "Allure results not found; skipping report generation"
          fi

      - name: Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-html-report
          path: ci-artifacts/allure-report/
          if-no-files-found: warn

      - name: Add report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: ci-artifacts/pytest-report.xml
          if-no-files-found: warn