services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: qa_db
      POSTGRES_USER: qa_user
      POSTGRES_PASSWORD: qa_password

    volumes:
      - ./sql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qa_user -d qa_db"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: .
    command: [ "python", "-m", "uvicorn", "api.integration_api:app", "--host", "0.0.0.0", "--port", "8000" ]
    environment:
      DB_NAME: qa_db
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: qa_user
      DB_PASSWORD: qa_password
      BASE_URL_LOCAL: http://api:8000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')" ]
      interval: 5s
      timeout: 5s
      retries: 10
  tests:
    build: .
    command: [ "python", "-m", "pytest", "-v", "--junitxml=/artifacts/pytest-report.xml", "--alluredir=/artifacts/allure-results"]
    volumes:
      - ./ci-artifacts:/artifacts
    environment:
      DB_NAME: qa_db
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: qa_user
      DB_PASSWORD: qa_password
      BASE_URL_LOCAL: http://api:8000
      BASE_URL: https://jsonplaceholder.typicode.com
      API_TOKEN: test-token
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy